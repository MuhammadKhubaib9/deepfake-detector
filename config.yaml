# =============================================================================
# DeepFake Detection System - Configuration
# Maps to FR/NFR identifiers from the SRS (see README traceability table).
# =============================================================================

server:
  host: 127.0.0.1
  port: 5000
  debug: false                    # NFR-07: fully-local inference; no external calls

uploads:
  upload_dir: uploads             # Tier-3 temporary storage
  session_expiry_seconds: 3600    # FR-20: temp files auto-deleted after 1 hour
  max_image_size_mb: 10           # FR-04
  max_video_size_mb: 100          # FR-04
  allowed_image_types: [image/jpeg, image/png]       # FR-01
  allowed_video_types: [video/mp4, video/x-msvideo]  # FR-02
  max_video_duration_seconds: 60  # FR-02: first 60 s analysed in v1.0

models:
  device: auto                    # auto | cpu | cuda

  cnn:                            # FR-11: XceptionNet CNN backbone
    name: XceptionNet             # FR-11 canonical CNN backbone
    type: xception                # timm 'legacy_xception' (FF++ C23 fine-tuned)
    checkpoint: ./models/xception_weights.pt
    backbone_prefix: "backbone."  # prefix inside the released checkpoint

  efficientnet:                   # EfficientNet-B3 (2nd spatial CNN, FR-11)
    name: "EfficientNet-B3"
    type: efficientnet_b3         # timm 'efficientnet_b3' (FF++ C23 fine-tuned)
    checkpoint: ./models/efficientnet_weights.pt
    backbone_prefix: "backbone."  # prefix inside the released checkpoint

  vit:                            # FR-12: Vision Transformer (transformers backend)
    name: "ViT-B/16"
    checkpoint: ./models/ViT  # self-hosted copy, primary source (no network)
    hf_repo: Khubaib7/deepfake-models  # fallback: your account if the local folder is absent
    hf_subfolder: ViT                   # ViT files live in the 'ViT/' subfolder of that repo
    labels: [Real, Fake]          # id2label of the HF checkpoint used

  lstm:                           # FR-13: ResNet-18 + 2-layer BiLSTM
    name: "ResNet18-BiLSTM"
    type: resnet_bilstm
    checkpoint: ./models/cnn_lstm_weights.pth
    hidden_size: 256
    num_layers: 2
    dropout: 0.3
    sequence_frames: 24           # TBD-03 resolved: 24-frame clip, as trained

  community:                      # CommunityForensics ViT-Small (CVPR 2025)
    name: "CommunityForensics-ViT"
    type: vit_small_384           # 2.7M samples / 4,803 generators, sigmoid logit
    checkpoint: ./models/community_forensics   # local clone (transformers format)
    hf_repo: Khubaib7/deepfake-models  # fallback: your account if local is absent
    hf_subfolder: community_forensics

  lnclip:                         # LNCLIP-DF: CLIP ViT-L/14, LN-tuned (WACV 2026)
    name: "LNCLIP-CLIP-ViTL14"
    type: torchscript
    checkpoint: ./models/lnclip/model.torchscript
    hf_repo: Khubaib7/deepfake-models  # fallback: your account if local is absent
    hf_subfolder: lnclip
    file: model.torchscript

ensemble:                         # FR-14: weighted soft voting (normalised internally)
  image_weights:                  # UC-03 image detection (CNN + EffNet + ViT + new ViTs)
    cnn: 1.0
    efficientnet: 1.0
    vit: 1.0
    community: 1.0                # cross-generator detector (CVPR 2025)
    lnclip: 1.0                   # generalizable CLIP detector (WACV 2026)
  video_weights:                  # UC-04 video detection (five models; the ViT
                                  # is image-only - it false-positives on real
                                  # video frames, see ensemble note)
    cnn: 1.0
    efficientnet: 1.0
    lstm: 0.7                     # temporal model is the least stable out-of-domain
    community: 1.0
    lnclip: 1.0
  threshold: 0.5                  # verdict: FAKE if P_fake >= threshold else REAL

preprocessing:
  video_fps: 5                    # FR-05: configurable frame extraction rate
  max_frames: 40                  # uniform sample of frames for analysis
  target_size: 224                # FR-09: model input resolution
  face_margin: 0.30               # crop pad around MTCNN box (models trained @ 30%)
  mtcnn_confidence: 0.95          # MTCNN conf threshold (Section 5.4.1)
  imagenet_mean: [0.485, 0.456, 0.406]             # FR-10
  imagenet_std: [0.229, 0.224, 0.225]              # FR-10

metrics:
  output_dir: metrics